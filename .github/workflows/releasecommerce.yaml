name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build package
        run: |
          python -m pip install build
          python -m build

      - name: Publish release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/
